
name: Daily Transit System Backup

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install requests

      - name: Backup to Google Drive
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          BACKUP_ADMIN_USERNAME: ${{ secrets.BACKUP_ADMIN_USERNAME }}
          BACKUP_ADMIN_PASSWORD: ${{ secrets.BACKUP_ADMIN_PASSWORD }}
        run: |
          cat > backup.py <<'PY'
          import os, json, requests
          from datetime import datetime
          from zoneinfo import ZoneInfo

          def secret(name):
              value = os.environ.get(name, '').strip()
              if not value:
                  raise RuntimeError(f'Missing secret: {name}')
              return value

          def check(response, label):
              if not response.ok:
                  raise RuntimeError(
                      f'{label} failed ({response.status_code}): '
                      f'{response.text[:500]}'
                  )
              return response

          token = check(requests.post(
              'https://oauth2.googleapis.com/token',
              data={
                  'client_id': secret('GOOGLE_CLIENT_ID'),
                  'client_secret': secret('GOOGLE_CLIENT_SECRET'),
                  'refresh_token': secret('GOOGLE_REFRESH_TOKEN'),
                  'grant_type': 'refresh_token'
              }, timeout=30
          ), 'Google authentication').json()['access_token']

          base = 'https://ntmc-transit-system.onrender.com'

          login = check(requests.post(
              base + '/api/auth/login',
              json={
                  'username': secret('BACKUP_ADMIN_USERNAME'),
                  'password': secret('BACKUP_ADMIN_PASSWORD')
              }, timeout=60
          ), 'Backend login').json()

          if login.get('user', {}).get('role') != 'ADMIN':
              raise RuntimeError('Backup account is not an ADMIN.')

          backup = check(requests.get(
              base + '/api/backup',
              headers={'Authorization': 'Bearer ' + login['token']},
              timeout=120
          ), 'Backup download').json()

          if not isinstance(backup.get('data'), dict):
              raise RuntimeError('Backup JSON format is unexpected.')

          date = datetime.now(ZoneInfo('Asia/Dhaka')).strftime('%Y-%m-%d')
          filename = f'Transit System Auto Backup File {date}.json'
          metadata = {
              'name': filename,
              'mimeType': 'application/json',
              'parents': [secret('GOOGLE_DRIVE_FOLDER_ID')]
          }

          boundary = 'transit_backup_boundary'
          body = (
              f'--{boundary}\r\n'
              'Content-Type: application/json; charset=UTF-8\r\n\r\n'
              + json.dumps(metadata, ensure_ascii=False)
              + f'\r\n--{boundary}\r\n'
              'Content-Type: application/json; charset=UTF-8\r\n\r\n'
              + json.dumps(backup, ensure_ascii=False, indent=2)
              + f'\r\n--{boundary}--\r\n'
          ).encode('utf-8')

          uploaded = check(requests.post(
              'https://www.googleapis.com/upload/drive/v3/files'
              '?uploadType=multipart&fields=id,name',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': f'multipart/related; boundary={boundary}'
              },
              data=body, timeout=120
          ), 'Google Drive upload').json()

          print('Backup uploaded:', uploaded.get('name'))
          print('Drive file ID:', uploaded.get('id'))
          PY
          python backup.py
